name: Daily Project Scan

# Scans @nadvolod's public GitHub repos for new projects with a public Vercel
# deployment. When one is found, opens a PR in this repo with the homepage
# update, an AI-generated cover image, and LinkedIn + X post drafts. Also
# opens a PR in nadvolod/nadvolod updating the "Latest Project" section.

on:
  schedule:
    # 14:00 UTC = 9am EST (10am EDT during DST — GitHub cron runs in UTC).
    - cron: '0 14 * * *'
  workflow_dispatch:

concurrency:
  group: daily-project-scan
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Configure git identity
        run: |
          git config user.name  "ultimateqa-bot"
          git config user.email "ultimateqa-bot@users.noreply.github.com"

      - name: Run scanner
        id: scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_TEAM_SLUG: ${{ secrets.VERCEL_TEAM_SLUG }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          NADVOLOD_PAT: ${{ secrets.NADVOLOD_PAT }}
        run: node scripts/scan-new-projects.mjs

      - name: Open PR with new project
        if: steps.scan.outputs.new_project == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_SLUG: ${{ steps.scan.outputs.project_slug }}
          PROJECT_TITLE: ${{ steps.scan.outputs.project_title }}
          PROJECT_URL: ${{ steps.scan.outputs.project_url }}
          NADVOLOD_PR_URL: ${{ steps.scan.outputs.nadvolod_pr_url }}
        run: |
          set -euo pipefail
          BRANCH="auto/new-project-${PROJECT_SLUG}-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add app/page.tsx public/ social-posts/
          git commit -m "Add new project: ${PROJECT_TITLE}"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "Add new project: ${PROJECT_TITLE}" \
            --body "$(cat <<EOF
          Auto-discovered a new project from @nadvolod's GitHub with a public Vercel deployment.

          **Project:** ${PROJECT_TITLE}
          **Live URL:** ${PROJECT_URL}

          ### Changes in this PR
          - \`app/page.tsx\` — new project entry added to the homepage projects array
          - \`public/${PROJECT_SLUG}.jpg\` — AI-generated cover image
          - \`social-posts/\` — LinkedIn and X launch post drafts

          ### Related
          - nadvolod/nadvolod README update: ${NADVOLOD_PR_URL}

          Generated by \`.github/workflows/daily-project-scan.yml\`.
          EOF
          )"

      - name: Log no-op
        if: steps.scan.outputs.new_project != 'true'
        run: echo "No new qualifying project found — nothing to open a PR for."
